name: Refresh Flipkart Snapshot Data

# Scheduled, cloud-run ingestion (see MARKETMIND_FIX_PLAN.md) -- replaces the
# old Windows Task Scheduler + refresh_snapshots.bat approach, which only ran
# on the owner's own PC and never reached the deployed Streamlit app. This is
# what actually keeps Supabase (and therefore every page + the AI Copilot)
# live, without any manual step or redeploy.
#
# Twice weekly: Monday and Thursday, 03:00 UTC (~08:30 IST).
on:
  schedule:
    - cron: '0 3 * * 1'
    - cron: '0 3 * * 4'
  workflow_dispatch: {}

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Run ingestion (scrape + upsert to Supabase)
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          ACTOR_ID: ${{ secrets.ACTOR_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          cd backend
          python daily_ingestion.py | tee "$GITHUB_STEP_SUMMARY"

      # Local CSVs written by this run are a backup/audit trail (see
      # daily_ingestion.py's save_snapshot()), not the source of truth --
      # Supabase is. Keep them as a short-lived downloadable artifact instead
      # of committing them back to the repo (the whole point of this pipeline
      # is that fresh data shows up without a git push or redeploy).
      - name: Upload CSV backups as a build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-csvs-${{ github.run_id }}
          path: pipelines/snapshots/*.csv
          retention-days: 14
          if-no-files-found: ignore
